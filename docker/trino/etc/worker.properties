# Trino worker config for distributed bench (matches the topology
# arneb uses: 1 coord + 2 workers, coord doesn't execute tasks).
#
# Mirrors the coord's resource limits so the cluster is uniform.

coordinator=false
http-server.http.port=8080
discovery.uri=http://trino-coord:8080
catalog.management=dynamic

# === Memory budget (same as coord; uniform per-node) ===
query.max-memory=8GB
query.max-memory-per-node=4GB
memory.heap-headroom-per-node=1GB

# === Concurrency ===
task.concurrency=16

# === CBO === (only meaningful on coord but no harm to set on worker)
optimizer.join-reordering-strategy=AUTOMATIC
