      # SF30 (broadcasts part/supplier/nation + the medium partsupp/orders).
      ARNEB_BROADCAST_MAX_BUILD_BYTES: "1000000000"
      # Bound the no-spill PROBE materialisation to 1 GiB (independent of the
      # 5 GB pool). A probe over the cap streams via the direct
      # single-build probe instead of collecting in full — q08's ~3.4 GB
