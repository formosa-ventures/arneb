      # Hive connector's missing plan-time column min/max stats. Proper fix:
      # wire Hive column min/max into CatalogStats so narrowing is stats-driven.
    command: ["--config", "/etc/arneb/worker-1.toml", "--role", "worker"]
    depends_on:
      arneb:
        condition: service_started
      hive-metastore:
        condition: service_healthy

  arneb-worker-2:
    deploy:
      resources:
        limits:
          cpus: "${BENCH_NODE_CPUS:-2}"
    image: arneb-bench:latest
    container_name: arneb-worker-2
