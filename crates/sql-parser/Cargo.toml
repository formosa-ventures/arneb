[package]
name = "arneb-sql-parser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arneb-common = { path = "../common" }
sqlparser.workspace = true
serde.workspace = true
# Used to constant-fold `DATE 'YYYY-MM-DD' ± INTERVAL 'N' YEAR/MONTH`
# at parse time. Calendar arithmetic (year/month boundaries, leap
# years) is non-trivial to do by hand and chrono is already in the
# dependency graph via arrow.
chrono = { version = "0.4", default-features = false }
