name: Release

on:
  push:
    branches: [main]
  # Manual re-run, e.g. to re-sync Cargo.lock on the open release PR.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  RELEASE_BRANCH: release-please--branches--main--components--arneb

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps `workspace.package.version` in Cargo.toml but not
      # Cargo.lock. Sync the workspace entries onto the open release PR here:
      # a separate `on: push` workflow wouldn't fire for GITHUB_TOKEN pushes,
      # and release-please force-pushes the branch on every regeneration.
      # Look the PR up directly rather than using `outputs.pr`, which is only
      # set when this run changed the PR.
      - name: Find open release PR
        id: release_pr
        if: ${{ !steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" \
            --state open --json headRefName --jq '.[0].headRefName // empty')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: ${{ steps.release_pr.outputs.branch }}
        with:
          ref: ${{ steps.release_pr.outputs.branch }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.release_pr.outputs.branch }}
      - name: Sync Cargo.lock with release version
        if: ${{ steps.release_pr.outputs.branch }}
        run: |
          # --workspace only rewrites workspace members' versions; dependency
          # versions stay pinned.
          cargo update --workspace
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync Cargo.lock with release version"
          git push
