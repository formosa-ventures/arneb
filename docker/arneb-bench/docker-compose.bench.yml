# Override file that adds arneb as a docker-compose service so the
# Trino-vs-arneb TPC-H benchmark runs both engines under identical
# Docker isolation (no native-vs-container bias).
#
# Usage:
#   docker compose --project-directory . \
#                  -f docker-compose.yml \
#                  -f docker/arneb-bench/docker-compose.bench.yml \
#                  up -d arneb trino
#
# Docker Desktop on this host has 3.88 GB total memory. Don't set
# mem_limit explicitly on the bench services — let them compete via
# Docker's defaults so neither one gets starved when the other is
# running. Arneb's Rust workload uses very little heap (~hundreds of
# MB) while Trino's JVM takes ~3 GB.

services:
  # Coordinator: pgwire on 5432 (only port exposed to host), Flight
  # RPC on 9090. Standalone-bench friendly name "arneb" is kept so
  # existing bench scripts (bench runner connects to arneb:5432) work
  # unchanged whether or not workers are present.
  arneb:
    deploy:
      resources:
        limits:
          cpus: "${BENCH_NODE_CPUS:-2}"
    build:
      context: .
      dockerfile: docker/arneb-bench/Dockerfile
    image: arneb-bench:latest
    container_name: arneb-arneb-1
    ports:
      - "5432:5432"
    # No ARNEB_* tuning env here: every engine lever this bench relies on
    # (Grace hash join, eager aggregation, parallel final aggregate, agg
    # pre-size, data-parallel scan, broadcast build-side swap, 16 Ki scan
    # batches, probe/agg prefetch, compact semi/anti build, LZ4 spill, CTE
    # self-aggregate window, jemalloc page decay) is already the in-binary
    # default. docs/guide/configuration.md lists each knob with its default
    # and the `=0` kill switch; set one here only for an A/B experiment.
    # MALLOC_CONF is intentionally never set (tikv-jemalloc ignores it).
    # Distributed-mode coordinator command (overrides image CMD).
    # Workers connect at arneb-coord:9090 via docker DNS. Keep
    # network alias `arneb-coord` so worker configs don't need to
    # know the compose-generated container name.
    command: ["--config", "/etc/arneb/coord.toml", "--role", "coordinator"]
    networks:
      default:
        aliases:
          - arneb-coord
    depends_on:
      hive-metastore:
        condition: service_healthy

  arneb-worker-1:
    deploy:
      resources:
        limits:
          cpus: "${BENCH_NODE_CPUS:-2}"
    image: arneb-bench:latest
    container_name: arneb-worker-1
    # No ARNEB_* tuning env here: every engine lever this bench relies on
    # (Grace hash join, eager aggregation, parallel final aggregate, agg
    # pre-size, data-parallel scan, broadcast build-side swap, 16 Ki scan
    # batches, probe/agg prefetch, compact semi/anti build, LZ4 spill, CTE
    # self-aggregate window, jemalloc page decay) is already the in-binary
    # default. docs/guide/configuration.md lists each knob with its default
    # and the `=0` kill switch; set one here only for an A/B experiment.
    # MALLOC_CONF is intentionally never set (tikv-jemalloc ignores it).
    command: ["--config", "/etc/arneb/worker-1.toml", "--role", "worker"]
    depends_on:
      arneb:
        condition: service_started
      hive-metastore:
        condition: service_healthy

  arneb-worker-2:
    deploy:
      resources:
        limits:
          cpus: "${BENCH_NODE_CPUS:-2}"
    image: arneb-bench:latest
    container_name: arneb-worker-2
    # No ARNEB_* tuning env here: every engine lever this bench relies on
    # (Grace hash join, eager aggregation, parallel final aggregate, agg
    # pre-size, data-parallel scan, broadcast build-side swap, 16 Ki scan
    # batches, probe/agg prefetch, compact semi/anti build, LZ4 spill, CTE
    # self-aggregate window, jemalloc page decay) is already the in-binary
    # default. docs/guide/configuration.md lists each knob with its default
    # and the `=0` kill switch; set one here only for an A/B experiment.
    # MALLOC_CONF is intentionally never set (tikv-jemalloc ignores it).
    command: ["--config", "/etc/arneb/worker-2.toml", "--role", "worker"]
    depends_on:
      arneb:
        condition: service_started
      hive-metastore:
        condition: service_healthy

  # Override the default trino service to apply Phase-D bench tuning:
  # the tuned config.properties (explicit query.max-memory + CBO,
  # task.concurrency=16 power-of-2 for our 14-core host) is mounted
  # over the image's bare-minimum default. jvm.config keeps the
  # image default — MaxRAMPercentage=80 of Docker's 3.88 GB total
  # gives a ~3 GB heap, which is enough once explicit per-query caps
  # prevent any one query from eating the whole heap.
  trino:
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
      - ./docker/trino/etc/config.properties:/etc/trino/config.properties
