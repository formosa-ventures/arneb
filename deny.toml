[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # paste v1.0.15 is unmaintained but no replacement available;
    # transitive dep via parquet -> arrow ecosystem
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
# Mozilla's root CA certificate bundle, pulled in by object_store 0.14 via
# reqwest 0.13 -> rustls-platform-verifier. CDLA-Permissive-2.0 is a permissive
# data license; allow it for this crate only rather than workspace-wide.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # TEMPORARY: orc-rust with the arrow 60 bump (Cargo.toml version bumps only),
    # pinned by rev in the workspace Cargo.toml. Upstream PR:
    # https://github.com/datafusion-contrib/orc-rust/pull/91 — switch back to
    # the crates.io release once it is published and remove this entry.
    "https://github.com/jackypan1989/orc-rust",
]
