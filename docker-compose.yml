# Arneb Benchmark & E2E Test Environment
#
# Provides:
#   - RustFS (S3-compatible object storage)
#   - Hive Metastore (standalone mode with embedded Derby)
#   - Trino (query engine for data generation and baseline benchmarks)
#   - TPC-H / TPC-DS seed services (Trino CTAS into Hive tables)
#
# Usage:
#   docker compose up -d                    # start RustFS + HMS + Trino
#   docker compose run tpch-seed            # seed TPC-H data (SF1)
#   docker compose run tpcds-seed           # seed TPC-DS data (SF1)
#   docker compose run iceberg-seed         # seed Iceberg tables (iceberg.ice.*)
#   docker compose down -v                  # tear down (delete volumes)

# Pin the Compose project name so container names are deterministic regardless
# of the directory the repo is cloned into. The benchmark scripts and oracles
# reference Trino containers by their fully-qualified name (e.g. arneb-trino-1);
# without this they would only resolve when the clone directory happens to be
# named "arneb". The arneb services set an explicit container_name in the bench
# overlay for the same reason.
name: arneb

services:
  # S3-compatible object storage: RustFS (Apache-2.0). MinIO's community images
  # are no longer publicly pullable (Docker Hub removed, quay.io requires auth).
  s3:
    image: rustfs/rustfs:1.0.1
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: s3admin
      RUSTFS_SECRET_KEY: s3adminsecret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3-init:
    image: amazon/aws-cli:2.37.11
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3adminsecret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3:9000 s3 mb s3://warehouse ||
      aws --endpoint-url http://s3:9000 s3 ls s3://warehouse
      "

  hive-metastore:
    # Custom image: apache/hive:4.2.0 + hadoop-aws + aws-java-sdk-bundle.
    # See docker/hive-metastore/Dockerfile and metastore-site.xml.
    build: ./docker/hive-metastore
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
    depends_on:
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/9083"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Trino coordinator. Distributed-mode (1 coord + 2 workers) is the
  # bench default since R1; worker services below register against
  # `trino-coord` (docker DNS alias). Single-node mode still works
  # because workers are independent services — stopping them leaves
  # coord with `node-scheduler.include-coordinator=true` semantics
  # disabled, so single-node bench requires re-enabling that line.
  trino:
    deploy:
      resources:
        limits:
          cpus: "${BENCH_NODE_CPUS:-2}"
    image: trinodb/trino:latest
    ports:
      - "8080:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
      - ./docker/trino/etc/config.properties:/etc/trino/config.properties
      - ./docker/trino/etc/jvm.config:/etc/trino/jvm.config
    networks:
      default:
        aliases:
          - trino-coord
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  trino-worker-1:
    deploy:
      resources:
        limits:
          cpus: "${BENCH_NODE_CPUS:-2}"
    image: trinodb/trino:latest
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
      - ./docker/trino/etc/worker.properties:/etc/trino/config.properties
      - ./docker/trino/etc/jvm.config:/etc/trino/jvm.config
    depends_on:
      trino:
        # Coord healthcheck runs `SELECT 1` which needs a worker
        # to be scheduled on — chicken-and-egg with workers waiting
        # for healthy coord. Use service_started instead; the worker
        # itself retries discovery via its own internal loop.
        condition: service_started
      hive-metastore:
        condition: service_healthy

  trino-worker-2:
    deploy:
      resources:
        limits:
          cpus: "${BENCH_NODE_CPUS:-2}"
    image: trinodb/trino:latest
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
      - ./docker/trino/etc/worker.properties:/etc/trino/config.properties
      - ./docker/trino/etc/jvm.config:/etc/trino/jvm.config
    depends_on:
      trino:
        # Coord healthcheck runs `SELECT 1` which needs a worker
        # to be scheduled on — chicken-and-egg with workers waiting
        # for healthy coord. Use service_started instead; the worker
        # itself retries discovery via its own internal loop.
        condition: service_started
      hive-metastore:
        condition: service_healthy

  tpch-seed:
    image: trinodb/trino:latest
    volumes:
      - ./docker/tpch-seed:/seed
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    environment:
      TPCH_SF: ${TPCH_SF:-sf1}
      TPCH_DECIMAL: ${TPCH_DECIMAL:-0}
      TRINO_SERVER: trino:8080
    depends_on:
      trino:
        condition: service_healthy
    profiles:
      - tpch-seed

  # Iceberg tables (HMS-backed, written by Trino's `iceberg` catalog) for
  # exercising Arneb's Iceberg reader through a `hive` catalog. See
  # docker/iceberg-seed/seed.sh.
  iceberg-seed:
    image: trinodb/trino:latest
    volumes:
      - ./docker/iceberg-seed:/seed
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    environment:
      TPCH_SF: ${TPCH_SF:-tiny}
      TRINO_SERVER: trino:8080
    depends_on:
      trino:
        condition: service_healthy
    profiles:
      - iceberg-seed

  tpcds-seed:
    image: trinodb/trino:latest
    volumes:
      - ./docker/tpcds-seed:/seed
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    environment:
      TPCDS_SF: ${TPCDS_SF:-sf1}
      TRINO_SERVER: trino:8080
    depends_on:
      trino:
        condition: service_healthy
    profiles:
      - tpcds-seed
