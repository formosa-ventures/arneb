# Arneb Benchmark & E2E Test Environment
#
# Provides:
#   - RustFS (S3-compatible object storage)
#   - Hive Metastore (standalone mode with embedded Derby)
#   - Trino (query engine for data generation and baseline benchmarks)
#   - TPC-H / TPC-DS seed services (Trino CTAS into Hive tables)
#
# Usage:
#   docker compose up -d                    # start RustFS + HMS + Trino
#   docker compose run tpch-seed            # seed TPC-H data (SF1)
#   docker compose run tpcds-seed           # seed TPC-DS data (SF1)
#   docker compose run iceberg-seed         # seed Iceberg tables (iceberg.ice.*)
#   docker compose up -d postgres           # PostgreSQL for the postgresql connector
#   docker compose run --rm pg-tpch-seed    # TPC-H dimensions into postgresql.tpch_mixed
#   docker compose down                     # tear down (keeps seeded data)
#   docker compose down -v                  # tear down AND delete seeded data
#
# Seeded data lives in two named volumes so that `down` / container recreate
# never loses it: `s3-data` (RustFS objects) and `hms-db` (HMS embedded Derby).

# Pin the Compose project name so container names are deterministic regardless
# of the directory the repo is cloned into. The benchmark scripts and oracles
# reference Trino containers by their fully-qualified name (e.g. arneb-trino-1);
# without this they would only resolve when the clone directory happens to be
# named "arneb". The arneb services set an explicit container_name in the bench
# overlay for the same reason.
name: arneb

services:
  # S3-compatible object storage: RustFS (Apache-2.0). MinIO's community images
  # are no longer publicly pullable (Docker Hub removed, quay.io requires auth).
  s3:
    image: rustfs/rustfs:1.0.4
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: s3admin
      RUSTFS_SECRET_KEY: s3adminsecret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3-init:
    image: amazon/aws-cli:2.38.5
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3adminsecret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3:9000 s3 mb s3://warehouse ||
      aws --endpoint-url http://s3:9000 s3 ls s3://warehouse
      "

  hive-metastore:
    # Custom image: apache/hive:4.2.0 + hadoop-aws + aws-java-sdk-bundle.
    # See docker/hive-metastore/Dockerfile and metastore-site.xml.
    build: ./docker/hive-metastore
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
    volumes:
      - hms-db:/opt/hive/metastore_db
    depends_on:
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/9083"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Trino coordinator. Distributed-mode (1 coord + 2 workers) is the
  # bench default since R1; worker services below register against
  # `trino-coord` (docker DNS alias). Single-node mode still works
  # because workers are independent services — stopping them leaves
  # coord with `node-scheduler.include-coordinator=true` semantics
  # disabled, so single-node bench requires re-enabling that line.
  trino:
    deploy:
      resources:
        limits:
          cpus: "${BENCH_NODE_CPUS:-2}"
    # Pinned (here and below): the seed services write the bench data with
    # this image, so a floating tag can change file layout between seeds.
    image: trinodb/trino:484
    ports:
      # Host side overridable for hosts where 8080 is already taken; the bench
      # scripts reach Trino from inside its container, so they never use it.
      - "${TRINO_HOST_PORT:-8080}:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
      - ./docker/trino/etc/config.properties:/etc/trino/config.properties
      - ./docker/trino/etc/jvm.config:/etc/trino/jvm.config
    networks:
      default:
        aliases:
          - trino-coord
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  trino-worker-1:
    deploy:
      resources:
        limits:
          cpus: "${BENCH_NODE_CPUS:-2}"
    image: trinodb/trino:484
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
      - ./docker/trino/etc/worker.properties:/etc/trino/config.properties
      - ./docker/trino/etc/jvm.config:/etc/trino/jvm.config
    depends_on:
      trino:
        # Coord healthcheck runs `SELECT 1` which needs a worker
        # to be scheduled on — chicken-and-egg with workers waiting
        # for healthy coord. Use service_started instead; the worker
        # itself retries discovery via its own internal loop.
        condition: service_started
      hive-metastore:
        condition: service_healthy

  trino-worker-2:
    deploy:
      resources:
        limits:
          cpus: "${BENCH_NODE_CPUS:-2}"
    image: trinodb/trino:484
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
      - ./docker/trino/etc/worker.properties:/etc/trino/config.properties
      - ./docker/trino/etc/jvm.config:/etc/trino/jvm.config
    depends_on:
      trino:
        # Coord healthcheck runs `SELECT 1` which needs a worker
        # to be scheduled on — chicken-and-egg with workers waiting
        # for healthy coord. Use service_started instead; the worker
        # itself retries discovery via its own internal loop.
        condition: service_started
      hive-metastore:
        condition: service_healthy

  tpch-seed:
    image: trinodb/trino:484
    volumes:
      - ./docker/tpch-seed:/seed
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    environment:
      TPCH_SF: ${TPCH_SF:-sf1}
      TPCH_DECIMAL: ${TPCH_DECIMAL:-0}
      TRINO_SERVER: trino:8080
    depends_on:
      trino:
        condition: service_healthy
    profiles:
      - tpch-seed

  # Iceberg tables (HMS-backed, written by Trino's `iceberg` catalog) for
  # exercising Arneb's Iceberg reader through a `hive` catalog. See
  # docker/iceberg-seed/seed.sh.
  iceberg-seed:
    image: trinodb/trino:484
    volumes:
      - ./docker/iceberg-seed:/seed
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    environment:
      TPCH_SF: ${TPCH_SF:-tiny}
      TRINO_SERVER: trino:8080
    depends_on:
      trino:
        condition: service_healthy
    profiles:
      - iceberg-seed

  tpcds-seed:
    image: trinodb/trino:484
    volumes:
      - ./docker/tpcds-seed:/seed
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    environment:
      TPCDS_SF: ${TPCDS_SF:-sf1}
      TRINO_SERVER: trino:8080
    depends_on:
      trino:
        condition: service_healthy
    profiles:
      - tpcds-seed

  # TPC-H dimension tables in PostgreSQL (postgresql.tpch_mixed) for the
  # mixed layout: dimensions remote, facts in Hive. Run the Hive seed at the
  # same TPCH_SF / TPCH_DECIMAL. See docker/postgres-tpch-seed/seed.sh.
  pg-tpch-seed:
    image: trinodb/trino:484
    volumes:
      - ./docker/postgres-tpch-seed:/seed
      - ./docker/tpch-seed:/tables:ro
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    environment:
      TPCH_SF: ${TPCH_SF:-sf1}
      TPCH_DECIMAL: ${TPCH_DECIMAL:-0}
      TRINO_SERVER: trino:8080
    depends_on:
      trino:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles:
      - pg-tpch-seed

  # PostgreSQL for Arneb's `postgresql` catalog (crates/postgresql) and the
  # bundled Trino's `postgresql` catalog over the same database. The fixture
  # in docker/postgres/init loads once, on an empty `pg-data` volume.
  postgres:
    image: postgres:17.6
    # Every statement is logged with its client's application_name (Arneb
    # connects as `arneb`), so pushdown is visible from the remote side:
    # benchmarks/tpch/scripts/pg_pushdown_evidence.py.
    command: ["postgres", "-c", "log_statement=all", "-c", "log_line_prefix=%m [%a] "]
    environment:
      POSTGRES_USER: arneb
      POSTGRES_PASSWORD: arneb
      POSTGRES_DB: arneb
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "arneb", "-d", "arneb"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  s3-data:
  hms-db:
  pg-data:
