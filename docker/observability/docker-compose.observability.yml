# Prometheus + Grafana over the bench cluster's /metrics.
#
#   docker compose -f docker-compose.yml -f docker/arneb-bench/docker-compose.bench.yml \
#     -f docker/observability/docker-compose.observability.yml up -d prometheus grafana
#
# Prometheus: http://localhost:9091  ·  Grafana: http://localhost:3000 (anonymous
# viewer; dashboard "Arneb"). Local use only: no auth on either.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.listen-address=:9090"]
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
