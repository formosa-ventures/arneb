connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083
# Trino renamed this from `fs.native-s3.enabled` (the old name is only a startup
# WARNING, not an error — Trino boots healthy with S3 silently disabled and the
# failure surfaces later as "Invalid location URI"). Re-check on Trino upgrades:
# docker compose logs trino | grep -i "has been replaced"
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
s3.region=us-east-1
