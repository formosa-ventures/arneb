[package]
name = "arneb-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "arneb"
path = "src/main.rs"

[features]
# Diagnostic-only: build jemalloc with `--enable-prof` so a worker can emit
# heap profiles (attribute the diffuse/untracked RSS the per-operator
# MemoryPool can't see — see exec-memory-accounting §1.2). Zero effect unless
# prof is activated at runtime via `_RJEM_MALLOC_CONF=prof:true,...`; not in
# the default build. Enable for a profiling image:
#   cargo build --release --features heap-profiling
heap-profiling = ["tikv-jemallocator/profiling"]

[dependencies]
# Internal crates
arneb-common = { path = "../common" }
arneb-catalog = { path = "../catalog" }
arneb-connectors = { path = "../connectors" }
arneb-execution = { path = "../execution" }
arneb-planner = { path = "../planner" }
arneb-protocol = { path = "../protocol" }
arneb-scheduler = { path = "../scheduler" }
arneb-rpc = { path = "../rpc" }
arneb-sql-parser = { path = "../sql-parser" }
arneb-hive = { path = "../hive" }
arrow = { workspace = true }
async-trait.workspace = true
async-recursion = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
futures.workspace = true
uuid.workspace = true

# CLI argument parsing
clap = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Error handling
anyhow = { workspace = true }

# jemalloc as global allocator: glibc malloc retains freed buffers in
# arena (dynamic mmap threshold ratchets up to 32MB → freed Arrow
# buffers under high-water stay as RSS). jemalloc's dirty_decay /
# muzzy_decay returns pages to OS via madvise, so cgroup memory.peak
# reflects true working set after each query instead of allocator
# high-water. Configure with MALLOC_CONF env var at runtime.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["stats"] }
# Phase 3b.6b (2026-05-21): read jemalloc's `stats.resident` to back-pressure
# task admission when the worker's actual RSS approaches the cgroup limit.
# Catches the untracked Arrow allocations (FilterExec / Project / Repartition
# channels / FlightDecoder) that the per-operator MemoryPool misses.
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }

# Config
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Web UI
axum = { workspace = true }
tower-http = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }

# HMS demo setup binary dependencies
hive-metastore = { path = "../hive-metastore" }
volo-thrift = "0.12"
pilota = "0.13"
parquet = { workspace = true, features = ["arrow"] }
object_store.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "io-util", "time", "signal"] }
pgwire = { workspace = true }
arrow = { workspace = true }
tempfile = "3"
arneb-catalog = { path = "../catalog" }
arneb-hive = { path = "../hive" }
arneb-connectors = { path = "../connectors" }
