{{- if not .Values.clusterSecret.existingSecret }}
{{- $name := include "arneb.clusterSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $secret := randAlphaNum 48 }}
{{- if and $existing $existing.data (hasKey $existing.data "secret") }}
{{- $secret = index $existing.data "secret" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "arneb.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ $secret | b64enc | quote }}
{{- end }}
