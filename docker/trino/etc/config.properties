# Trino server config — extended for benchmark fairness (Phase D).
# Defaults at /etc/trino/config.properties baked into the image cover
# only the bare minimum; this file replaces it to add explicit memory
# limits + CBO so the bench load (≥ 20 warmup × 16 queries) doesn't
# OOM-kill Trino under Docker Desktop's 3.88 GB total memory.

# === Baseline (distributed bench: 1 coord + 2 workers) ===
coordinator=true
# Coord routes queries only; tasks execute on workers (matches
# arneb's role split). Without this, single-node Trino would also
# act as worker — asymmetric vs our 1-coord+2-worker arneb cluster.
node-scheduler.include-coordinator=false
http-server.http.port=8080
# Workers reach the coord via docker DNS alias `trino-coord`
# (set in docker-compose.yml). Localhost was for legacy single-node.
discovery.uri=http://trino-coord:8080
catalog.management=dynamic

# === Memory budget ===
# Docker Desktop has 3.88 GB total. Trino's default
# MaxRAMPercentage=80 gives JVM heap ~3 GB. These caps prevent any
# single query from consuming the full heap and starving the
# subsequent queries during back-to-back bench loops — the exact
# failure mode that crashed Trino in Phase C (warmup=20 × 16
# queries OOM'd at around Q09).
query.max-memory=8GB
query.max-memory-per-node=4GB
memory.heap-headroom-per-node=1GB

# === Concurrency ===
# task.concurrency must be a power of 2 (Trino's TaskManagerConfig
# enforces this). Host has 14 cores so 16 is the closest power of 2
# without dropping cores.
task.concurrency=16

# === Cost-based optimizer ===
# CBO has been on by default since Trino 350+, but join reordering
# strategy is documented explicitly. Requires `ANALYZE <table>` to
# populate column-level stats for joins / aggregates / TopN to be
# fully effective.
optimizer.join-reordering-strategy=AUTOMATIC

# === Query lifecycle ===
# Default query.client.timeout (5m) is fine; finished queries are
# discarded as soon as the client drains them.
