[package]
name = "arneb-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Internal crates
arneb-common = { path = "../common" }
arneb-sql-parser = { path = "../sql-parser" }
arneb-catalog = { path = "../catalog" }
arneb-planner = { path = "../planner" }
arneb-execution = { path = "../execution" }
arneb-connectors = { path = "../connectors" }
arneb-scheduler = { path = "../scheduler" }

# Arrow columnar format
arrow = { workspace = true }

# Async runtime & networking
tokio = { workspace = true, features = ["time", "sync"] }

# PostgreSQL wire protocol
pgwire = { workspace = true }
async-trait = { workspace = true }
async-recursion = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }

# Trino client REST protocol (HTTP listener + JSON bodies)
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
percent-encoding = "2"

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
chrono = "0.4"
hex = "0.4"

# Authentication (SCRAM-SHA-256). aws-lc-rs is already pulled in by pgwire's
# default `server-api-aws-lc-rs` feature, so this adds no new crypto stack.
aws-lc-rs = "1"
base64 = "0.23"
stringprep = "0.1"

# TLS for the client-facing listeners. Same versions and aws-lc-rs provider
# pgwire already pulls in, so no second crypto stack.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
# HTTPS accept loop for the Trino listener (axum::serve takes plain TCP only).
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "io-util", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
pgwire = { workspace = true }
tokio-postgres = "0.7"
postgres-protocol = "0.6"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
tokio-postgres-rustls = "0.14"
