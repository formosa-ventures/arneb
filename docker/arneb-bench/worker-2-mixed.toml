# Mixed (federated) layout — docker-compose.mixed.yml mounts this over worker-2.toml.
# Same as worker-2.toml, but the catalogs are named like the bundled Trino's
# (hive, postgresql) so benchmarks/tpch/queries-mixed runs unchanged.

# arneb worker-2 config (mirror of worker-1, differs only in worker_id).

bind_address = "0.0.0.0"

[cluster]
role = "worker"
rpc_port = 9090
coordinator_address = "arneb-coord:9090"
worker_id = "worker-2"
advertised_address = "arneb-worker-2:9090"

[storage.s3]
region = "us-east-1"
endpoint = "http://s3:9000"
allow_http = true
access_key_id = "s3admin"
secret_access_key = "s3adminsecret"

[[catalogs]]
name = "hive"
type = "hive"
metastore_uri = "hive-metastore:9083"
default_schema = "tpch"

# Phase 2c (2026-05-21): see worker-1.toml comment for rationale.
[memory]
spill_budget_bytes = 6442450944
query_max_memory_per_node = 6442450944
# DEPRECATED (Phase A, 2026-05-23): see worker-1.toml. Field has
# no runtime effect; left only so this config still loads.
task_concurrency = 2
# Phase 3b.6b / M.4: see worker-1.toml for 3 GB threshold rationale.
task_admission_threshold_bytes = 8589934592

[[catalogs]]
name = "postgresql"
type = "postgresql"
connection_url = "postgresql://postgres:5432/arneb"
user = "arneb"
password = "arneb"
default_schema = "tpch_mixed"
