# arneb coordinator config for distributed bench (1 coord + 2 workers).
# Coord accepts pgwire on 5432, Flight RPC on 9090. Workers connect via
# `coordinator_address` in their own config.

bind_address = "0.0.0.0"
port = 5432

[cluster]
role = "coordinator"
rpc_port = 9090

[storage.s3]
region = "us-east-1"
endpoint = "http://minio:9000"
allow_http = true
access_key_id = "minioadmin"
secret_access_key = "minioadmin"

[[catalogs]]
name = "datalake"
type = "hive"
metastore_uri = "hive-metastore:9083"
default_schema = "tpch"

# Phase 2c (2026-05-21): coord runs the root fragment and any in-plan
# SemiJoin/AntiJoin that wasn't pushed to workers. Same 500 MB cap as
# workers — see worker-1.toml comment.
[memory]
spill_budget_bytes = 6442450944
query_max_memory_per_node = 6442450944
